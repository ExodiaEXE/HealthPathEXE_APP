name: health
description: HealthPath - Mobile wellness app (Flutter)
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  http: ^1.2.2
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.0.17
  just_audio: ^0.9.42
  audio_session: ^0.1.25
  audio_service: ^0.18.18
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.2.1
  web_socket_channel: ^3.0.3
  model_viewer_plus:
    path: packages/model_viewer_plus
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android 2.3+ dùng JNI và gây lỗi dart_api.h trên một số bản Flutter/NDK.
# App không dùng path_provider trực tiếp — chỉ kéo theo từ flutter_secure_storage (Windows).
dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
    - assets/companion/mascot.glb
    - assets/companion/LICENSE.txt
    - assets/companion/rooms/room_1.jpg
    - assets/companion/rooms/room_2.jpg
    - assets/companion/rooms/room_3.jpg
    - assets/companion/rooms/room_4.jpg
